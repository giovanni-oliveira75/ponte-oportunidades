name: Atualizar mural de oportunidades

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 06:00 (horário de Brasília)
  workflow_dispatch:       # permite rodar manualmente pela aba Actions
  push:
    branches: [main]
    paths: ["crawler/**", "sources_fixed.yaml", "requirements.txt"]

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m crawler.main
      - name: Publicar resultado
        run: |
          git config user.name "ponte-oportunidades-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Atualização automática $(date -u +%Y-%m-%d)"
          git push
